send_anonymous_usage_stats: true
project_id: tap-f1
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: tap-f1
    namespace: tap_f1
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: start_date
      kind: date_iso8601
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
